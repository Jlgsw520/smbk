<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阅读器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#0a0c0f;color:#e7ecf3;font:15px/1.4 system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:0}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#page{max-width:100%;max-height:100%;display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#7c8798;padding:30px}
#msg h2{margin:0;font-size:17px;color:#ccd6e3}
#msg p{margin:0;font-size:13px;max-width:90%;word-break:break-all}
#msg button{padding:10px 26px;border-radius:10px;background:#3b7ddd;color:#fff;font-size:14px;font-weight:600}
.top,.bottom{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;z-index:20;transition:.22s}
.top{top:0;padding:env(safe-area-inset-top) 10px 10px;background:linear-gradient(180deg,rgba(10,13,18,.85),transparent)}
.bottom{bottom:0;padding:10px 10px env(safe-area-inset-bottom);background:linear-gradient(0deg,rgba(10,13,18,.85),transparent)}
.top .title{flex:1;text-align:center;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon,.nav{width:52px;height:52px;border-radius:50%;background:rgba(20,26,36,.7);color:#e7ecf3;display:grid;place-items:center}
.icon:active,.nav:active:not(:disabled){transform:scale(.9)}
.nav:disabled{opacity:.3}
.icon svg,.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ind{min-width:80px;text-align:center;font-size:14px;font-weight:600;color:#dbe4f0;padding:8px 12px;border-radius:12px;background:rgba(20,26,36,.55)}
</style>
</head>
<body>
<div id="stage">< img id="page" alt=""><div id="msg"></div></div>
<div class="top"><button class="icon" id="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="title" id="title">加载中</span><button class="icon" id="reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button></div>
<div class="bottom"><button class="nav" id="prev"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="ind" id="ind">0 / 0</span><button class="nav" id="next"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var page=$('page'),msg=$('msg'),title=$('title'),ind=$('ind');
var S={list:[],i:0,name:'',busy:false};
function show(h){msg.style.display='flex';msg.innerHTML=h}
function hide(){msg.style.display='none'}
function btn(t,f){var b=document.createElement('button');b.textContent=t;b.onclick=f;return b}
function load(){
  var g=new URLSearchParams(location.search).get('g');
  if(!g){show('<h2>缺少分组参数</h2>');return}
  S.name=g;title.textContent=g;
  var url='groups/'+g+'.json';
  show('<h2>读取分组…</h2><p>'+url+'</p >');
  fetch(url,{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(d){
    var a=[];
    d.forEach(function(it){
      if(typeof it==='string')a.push(it);
      else if(it&&it.url)a.push(it.url);
    });
    if(!a.length){show('<h2>分组为空</h2>');return}
    S.list=a;S.i=0;go(0);
  }).catch(function(e){
    show('<h2>加载失败</h2><p>'+e.message+'</p >');
    msg.appendChild(btn('重试',function(){location.reload()}));
  });
}
function go(i){
  if(S.busy||!S.list.length)return;
  i=Math.max(0,Math.min(i,S.list.length-1));S.i=i;S.busy=true;
  var u=S.list[i];
  show('<h2>加载 '+(i+1)+' / '+S.list.length+'</h2>');
  var done=false;
  var t=setTimeout(function(){
    if(done)return;done=true;S.busy=false;
    show('<h2>超时</h2><p>'+u+'</p >');
    msg.appendChild(btn('重试',function(){S.busy=false;go(S.i)}));
  },15000);
  var im=new Image();
  im.onload=function(){
    if(done)return;done=true;clearTimeout(t);S.busy=false;
    page.src=u;hide();ui();
  };
  im.onerror=function(){
    if(done)return;done=true;clearTimeout(t);S.busy=false;
    show('<h2>图片失败</h2><p>'+u+'</p >');
    msg.appendChild(btn('重试',function(){S.busy=false;go(S.i)}));
    msg.appendChild(btn('下一张',function(){S.busy=false;go(S.i+1)}));
  };
  im.src=u;
}
function ui(){
  ind.textContent=(S.i+1)+' / '+S.list.length;
  $('prev').disabled=S.i<=0;
  $('next').disabled=S.i>=S.list.length-1;
  title.textContent=S.name+' · '+(S.i+1)+'/'+S.list.length;
}
var g=null;
$('stage').addEventListener('touchstart',function(e){
  if(e.touches.length!==1)return;
  var t=e.touches[0];g={x:t.clientX,y:t.clientY,t:Date.now(),m:false};
},{passive:true});
$('stage').addEventListener('touchmove',function(e){
  if(!g)return;
  if(Math.abs(e.touches[0].clientX-g.x)+Math.abs(e.touches[0].clientY-g.y)>8)g.m=true;
},{passive:true});
$('stage').addEventListener('touchend',function(e){
  if(!g)return;
  var t=e.changedTouches[0];
  var dx=t.clientX-g.x,dy=t.clientY-g.y,dt=Date.now()-g.t;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<600){go(dx<0?S.i+1:S.i-1)}
  g=null;
},{passive:true});
$('back').onclick=function(){location.href='./'};
$('reload').onclick=function(){location.reload()};
$('prev').onclick=function(){if(!S.busy)go(S.i-1)};
$('next').onclick=function(){if(!S.busy)go(S.i+1)};
load();
})();
</script>
</body>
</html>
