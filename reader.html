<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>图片阅读器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:#0a0c0f;color:#e7ecf3;
  font:15px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;
  height:100vh;height:100dvh;
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}

#stage{
  position:fixed;inset:0;overflow:hidden;touch-action:none;
  background:radial-gradient(900px 600px at 50% -5%,#141922 0%,transparent 70%),
             radial-gradient(700px 500px at 50% 105%,#0e131a 0%,transparent 70%);
  display:flex;align-items:center;justify-content:center;
}
#page{
  max-width:100%;max-height:100%;
  display:block;
  transform-origin:center center;
  will-change:transform;
  pointer-events:none;
  -webkit-user-drag:none;
  transition:opacity .18s;
}
#page.hidden{opacity:0}

#msg{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;
  color:#7c8798;padding:40px 28px;
}
#msg h2{margin:0;font-size:17px;font-weight:600;color:#ccd6e3}
#msg p{margin:0;font-size:13px;max-width:90%;line-height:1.7;word-break:break-all}
#msg .spin{
  width:28px;height:28px;border-radius:50%;
  border:3px solid rgba(255,255,255,.15);border-top-color:#5b9dff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#msg .retry{
  margin-top:8px;padding:10px 26px;border:0;border-radius:10px;
  background:#3b7ddd;color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;
}
#msg .retry:active{background:#4c8be8}
#msg .err-url{
  font-size:11px;color:#5a6472;word-break:break-all;
  max-width:90%;margin-top:6px;padding:8px 12px;
  background:#10141a;border-radius:8px;line-height:1.5;
  font-family:ui-monospace,Menlo,monospace;
}

#debug{
  position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:99;padding:6px 10px;border-radius:8px;
  background:rgba(0,0,0,.75);color:#8c98a8;font-size:10px;
  font-family:ui-monospace,Menlo,monospace;line-height:1.5;
  max-width:70vw;pointer-events:none;
  border:1px solid rgba(255,255,255,.08);
}

.top{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:6px;
  height:calc(52px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 8px 0 8px;
  background:linear-gradient(180deg,rgba(10,13,18,.85) 0%,rgba(10,13,18,0) 100%);
  transition:opacity .22s,transform .25s;
}
.top .title{
  flex:1;min-width:0;font-size:15px;font-weight:600;
  text-align:center;color:#e7ecf3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 4px;
}
.top .icon{
  width:44px;height:44px;flex:none;
  border:0;border-radius:50%;
  background:rgba(20,26,36,.7);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:#e7ecf3;
  display:grid;place-items:center;
  transition:transform .12s,background .15s;
}
.top .icon:active{transform:scale(.9);background:rgba(50,60,78,.9)}
.top .icon svg{
  width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
}

.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:14px;
  height:calc(64px + env(safe-area-inset-bottom));
  padding:0 16px env(safe-area-inset-bottom);
  background:linear-gradient(0deg,rgba(10,13,18,.85) 0%,rgba(10,13,18,0) 100%);
  transition:opacity .22s,transform .25s;
}
.nav-btn{
  width:56px;height:56px;flex:none;
  border:0;border-radius:50%;
  background:rgba(20,26,36,.7);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:#e7ecf3;
  display:grid;place-items:center;
  transition:transform .12s,background .15s,opacity .15s;
}
.nav-btn:active:not(:disabled){transform:scale(.9);background:rgba(50,60,78,.9)}
.nav-btn:disabled{opacity:.3}
.nav-btn svg{
  width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
}
.page-indicator{
  min-width:80px;text-align:center;
  font-size:14px;font-weight:600;
  color:#dbe4f0;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(20,26,36,.55);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
body.ui-hidden .top{opacity:0;transform:translateY(-20px);pointer-events:none}
body.ui-hidden .bottom{opacity:0;transform:translateY(20px);pointer-events
